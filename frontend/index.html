<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trending Keywords Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
      html, body, #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      .fade-enter-active,
      .fade-leave-active {
        transition: opacity 0.5s;
      }
      .fade-enter-from,
      .fade-leave-to {
        opacity: 0;
      }
      .side-panel {
        position: absolute;
        right: 10px;
        top: 50px;
        width: 300px;
        max-height: 80%;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #ccc;
        border-radius: 4px;
        overflow-y: auto;
        padding: 15px;
        z-index: 1001;
      }
      .about-button {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1001;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 8px 12px;
        cursor: pointer;
      }
      .github-button {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1001;
        cursor: pointer;
      }
      #map {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
